---
- name: Update SitePackge.lua
  copy:
    src: ../../shared-files/SitePackage.lua
    dest: "{{ lmod_loc }}/libexec/SitePackage.lua"

- name: Setup rsyslog
  template:
    src: rsyslog.j2
    dest: /etc/rsyslog.d/moduleTracking-client.conf

- name: Restart rsyslog
  service:
    name: rsyslog
    state: restarted
